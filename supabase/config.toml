project_id = "fjscqsatzsmfivpczaud"

# Authentication is enforced inside each handler: exact trusted worker key,
# workspace webhook secret, or Auth.getUser plus the Crisp role check. Keep
# this consistent with the MCP deployments and the existing Vault cron key.
[functions.crisp-auto-greet]
verify_jwt = false

[functions.crisp-webhook]
verify_jwt = false

# HMAC verification and per-workspace opt-in are enforced by this handler.
[functions.crisp-plugin-webhook]
verify_jwt = false

# Per-site HMAC authentication; never a public unsigned presence upsert.
[functions.crisp-site-arrival]
verify_jwt = false

[functions.crisp-send-message]
verify_jwt = false

[functions.crisp-mark-read]
verify_jwt = false

[functions.crisp-sync-history]
verify_jwt = false

# Gateway JWT validation PLUS getUser/roles/RLS inside the handler.
[functions.cs-compose-lead]
verify_jwt = true

# Comparison-only beta: validated user plus reporting role inside handler.
[functions.quo-ai-status]
verify_jwt = true

# Quo signs deliveries itself and sends no Supabase JWT, so the gateway cannot
# authenticate them. The handler verifies the HMAC over the raw body before it
# trusts anything, and is idempotent on the signed webhook-id.
[functions.quo-webhook]
verify_jwt = false
